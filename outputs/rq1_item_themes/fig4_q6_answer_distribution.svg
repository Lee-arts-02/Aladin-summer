<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="500" viewBox="0 0 1050 500">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
.title { font-size: 18px; font-weight: 700; }
.axis { font-size: 12px; fill: #36454f; }
.small { font-size: 10px; fill: #4b5563; }
.tiny { font-size: 9px; fill: #4b5563; }
.tick { stroke: #d0d7de; stroke-width: 1; }
.frame { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="28" y="34" class="title">Q6 answer distribution: dark-colored roofs in hot, sunny climates</text>
<line x1="420.0" y1="52" x2="420.0" y2="335" class="tick"/>
<text x="420.0" y="353" text-anchor="middle" class="small">0%</text>
<line x1="520.0" y1="52" x2="520.0" y2="335" class="tick"/>
<text x="520.0" y="353" text-anchor="middle" class="small">20%</text>
