<rect x="420" y="68" width="367.6" height="16" fill="#9CA3AF"/>
<rect x="420" y="89" width="316.2" height="16" fill="#C2410C"/>
<text x="793.6" y="81" class="tiny">73.5</text>
<text x="742.2" y="102" class="tiny">63.2</text>
<text x="408" y="132" text-anchor="end" class="small">Dark colors have a higher specific heat.</text>
<rect x="420" y="123" width="51.5" height="16" fill="#9CA3AF"/>
<rect x="420" y="144" width="73.5" height="16" fill="#C2410C"/>
<text x="477.5" y="136" class="tiny">10.3</text>
<text x="499.5" y="157" class="tiny">14.7</text>
